<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>General Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { color: #009688; }
    label { font-weight: bold; display: block; margin-top: 16px; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #chat-box {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.6;
      max-width: 85%;
    }
    .user-bubble {
      background: #009688;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .ai-bubble {
      background: white;
      color: #1c1c1c;
      align-self: flex-start;
      border-right: 4px solid #009688;
      border-bottom-left-radius: 2px;
    }
    #input-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    #input-row input { margin-top: 0; }
    button {
      background: #009688;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #00796b; }
    #role-section { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>General Assistant</h1>

  <div id="role-section">
    <label for="role">תפקיד ה-assistant</label>
    <input id="role" type="text" placeholder="לדוגמה: You are a pastry expert" />
  </div>

  <div id="chat-box"></div>

  <div id="input-row">
    <input id="question" type="text" placeholder="שאל משהו..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">שלח</button>
  </div>

  <script>
    let sessionId = null;

    async function sendMessage() {
      const role     = document.getElementById("role").value.trim();
      const input    = document.getElementById("question");
      const question = input.value.trim();
      const chatBox  = document.getElementById("chat-box");

      if (!role || !question) return;

      // צור session בפנייה הראשונה
      if (!sessionId) {
        const res  = await fetch("/start", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ role })
        });
        const data = await res.json();
        sessionId  = data.session_id;
      }

      // הצג בועת משתמש
      chatBox.innerHTML += `<div class="bubble user-bubble">${question}</div>`;
      input.value = "";

      // הצג placeholder
      const aiDiv = document.createElement("div");
      aiDiv.className   = "bubble ai-bubble";
      aiDiv.textContent = "...";
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      const response = await fetch("/ask", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ session_id: sessionId, question })
      });

      const data    = await response.json();
      aiDiv.textContent = data.answer ?? data.detail ?? "שגיאה";
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
